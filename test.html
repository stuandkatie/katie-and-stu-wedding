    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">

    <style>
        /* =========================================
           GLOBAL VARIABLES & BASE STYLES
           ========================================= */
        :root {
            --gold: #d4af37;
            --gold-deep: #8a6a16;
        }

        body {
            margin: 0;
            font-family: 'Inter', system-ui, sans-serif;
        }

        /* =========================================
           TYPOGRAPHY
           ========================================= */
        h1, h2, h3 {
            font-family: 'Playfair Display', serif;
            font-weight: 400;
        }

        /* =========================================
           LAYOUT & BACKGROUND
           ========================================= */
        /* Full-screen hero background with a dark gradient overlay.
           The overlay is deliberately strong: the photo is brightest
           right where the text sits. */
        .hero-bg {
            background-image: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.6)), url('Background.jpg');
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
            color: white;
            position: relative; /* Acts as anchor for the absolute nav bar */
            padding: 120px 1.5rem 60px 1.5rem;
            box-sizing: border-box;
        }

        .hero-content {
            position: relative;
            padding: 2.5rem 2rem;
        }

        /* Soft dark pool behind the hero text, fading out at the edges so
           the outer parts of the photo stay bright */
        .hero-content::before {
            content: "";
            position: absolute;
            inset: -10% -5%;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.3) 45%, rgba(0,0,0,0) 75%);
            z-index: -1;
        }

        /* Main hero header text sizing */
        .hero-content h1 {
            font-size: 4.8rem;
            line-height: 1;
            margin-bottom: 0.4rem;
            letter-spacing: -0.02em;
            text-shadow: 0 2px 14px rgba(0,0,0,0.5);
        }

        /* Wedding date, the largest line after the names */
        .hero-date {
            font-size: 2.1rem;
            margin: 0 0 1rem 0;
            text-shadow: 0 2px 16px rgba(0,0,0,0.75), 0 1px 3px rgba(0,0,0,0.5);
        }

        /* Welcome party line, secondary to the wedding date */
        .hero-welcome {
            font-size: 1.3rem;
            margin: 0 0 3rem 0;
            text-shadow: 0 2px 16px rgba(0,0,0,0.75), 0 1px 3px rgba(0,0,0,0.5);
        }

        /* =========================================
           DESKTOP NAVIGATION
           ========================================= */
        .nav {
            position: absolute;
            top: 0; left: 0; right: 0;
            z-index: 50;
            background: rgba(38, 35, 32, 0.55);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.18);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.2rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 2.3rem;
            color: white;
            text-decoration: none;
            white-space: nowrap;
            text-shadow: 0 1px 4px rgba(0,0,0,0.45);
        }

        .hamburger {
            display: none;
            font-size: 2rem;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            text-shadow: 0 1px 4px rgba(0,0,0,0.45);
        }

        .nav-links { display: flex; gap: 10px; }

        .nav-links a {
            padding: 10px 20px;
            border-radius: 9999px;
            font-size: 1.05rem;
            color: white;
            text-decoration: none;
            border: 1px solid rgba(255,255,255,0.7);
            text-shadow: 0 1px 4px rgba(0,0,0,0.45);
            transition: all 0.3s;
        }

        .nav-links a:hover {
            background: white;
            color: #2a2724;
            text-shadow: none;
        }

        /* =========================================
           BUTTON COMPONENTS
           ========================================= */
        /* Row holding the two call-to-action buttons */
        .hero-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 14px 36px;
            border-radius: 9999px;
            font-size: 1.1rem;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: white;
            color: #2a2724;
        }

        .btn-primary:hover {
            background: #f5f5f4;
            transform: translateY(-2px);
        }

        /* =========================================
           LOCATION TEXT STYLING
           ========================================= */
        .location-castle,
        .location-country {
            letter-spacing: 0.125em;
            font-size: 1rem;
            color: #fde9c8;
            text-shadow: 0 1px 8px rgba(0,0,0,0.6);
        }

        .location-castle { margin-bottom: 0.25rem; }
        .location-country { margin-bottom: 1rem; }

        /* Desktop-only location formatting */
        @media (min-width: 769px) {
            .location-castle,
            .location-country {
                display: inline;
                margin: 0;
            }

            /* Inserts a bullet point between the two locations on larger screens */
            .location-country::before {
                content: " • ";
            }
        }

        /* =========================================
           MOBILE RESPONSIVE STYLES (< 768px)
           ========================================= */
        @media (max-width: 768px) {
            .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 100%; left: 0; right: 0;
                background: rgba(255,255,255,0.98);
                padding: 1.5rem;
                gap: 10px;
                box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            }
            .nav-links.show { display: flex; }
            .nav-links a {
                color: #2a2724;
                text-align: center;
                font-size: 1.1rem;
                border: none;
                text-shadow: none;
            }
            .hamburger { display: block; }
            .logo { font-size: 2rem; }

            /* Scale down the hero for small screens */
            .hero-content { padding: 2rem 0.5rem; }
            .hero-content h1 { font-size: 3.5rem; }
            .hero-date { font-size: 1.6rem; }
            .hero-welcome { font-size: 1.1rem; margin-bottom: 2.5rem; }

            /* Stack the buttons full width */
            .hero-buttons { flex-direction: column; align-items: stretch; }
            .btn { padding: 14px 24px; }

            /* Stack location tags vertically on small screens */
            .location-castle,
            .location-country {
                display: block;
                text-align: center;
            }
        }
    </style>

    <header class="hero-bg">

            <h1>Katie &amp; Stu</h1>
            <p class="hero-date">Wedding &bull; September 18, 2027</p>
            <p class="hero-welcome">Welcome Party &bull; September 17, 2027</p>

            <div class="hero-buttons">
                <a href="about.html" class="btn btn-primary">Our Story</a>
                <a href="rsvp.html" class="btn btn-primary">RSVP</a>
            </div>
        </div>
    </header>

    <script>
        // Target the hamburger button and navigation links container
        const hamburger = document.getElementById('hamburger');
        const navLinks = document.getElementById('navLinks');

        // Listen for click events to open/close the mobile menu
        hamburger.addEventListener('click', () => {
            navLinks.classList.toggle('show');
        });
    </script>

</body>
